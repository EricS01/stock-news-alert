# Stocks to watch. Aliases are matched case-insensitively as whole words.
# Tickers are matched as cashtags ($NVDA) or uppercase standalone words.
# Tickers listed under cashtag_only match only as cashtags, because the bare
# word is common in other contexts ("CRM software", "LOW COST").
threshold: 4  # minimum impact score (1-5) to send a push

sources:
  hackernews: true
  news: true
  sec: true
  reddit: true

stocks:
  AAPL: [Apple, iPhone, Tim Cook]
  MSFT: [Microsoft, Azure, Satya Nadella]
  NVDA: [Nvidia, Jensen Huang]
  GOOGL: [Google, Alphabet, Waymo, Sundar Pichai]
  AMZN: [Amazon, AWS, Andy Jassy]
  META: [Meta Platforms, Facebook, Instagram, WhatsApp, Mark Zuckerberg, Zuckerberg]
  TSLA: [Tesla, Elon Musk]
  AMD: [Advanced Micro Devices, Lisa Su]
  AVGO: [Broadcom, Hock Tan]
  NFLX: [Netflix]
  CRM: [Salesforce, Marc Benioff]
  ORCL: [Oracle, Larry Ellison]
  JPM: [JPMorgan, JP Morgan, Jamie Dimon]
  UNH: [UnitedHealth, UnitedHealthcare, Optum]
  LLY: [Eli Lilly, Mounjaro, Zepbound]
  XOM: [Exxon, ExxonMobil, Exxon Mobil]
  COST: [Costco]

cashtag_only: [CRM, COST]
