name: Check news

on:
  schedule:
    # Off the top of the hour: GitHub may drop scheduled runs during the
    # :00 rush, so run at :07, :22, :37, :52 instead.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print alerts instead of pushing"
        type: boolean
        default: false

# Never run two checks at once: overlapping runs would race on seen.json
# and could send duplicate pushes.
concurrency:
  group: check-news
  cancel-in-progress: false

permissions:
  contents: write  # to commit state/seen.json back

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python -m alerts.main ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Save seen-items state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet || git commit -m "Update seen-items state [skip ci]"
          git pull --rebase --autostash
          git push
