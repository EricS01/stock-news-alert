name: Check news
run-name: ${{ inputs.job || 'alerts' }}${{ inputs.dry_run && ' (dry run)' || '' }}

# Triggered by AWS EventBridge via the workflow_dispatch API (see README:
# "Reliable scheduling with AWS EventBridge"); each schedule sends a different
# `job`. GitHub's own `schedule:` trigger was removed because it was unreliable.
on:
  workflow_dispatch:
    inputs:
      job:
        description: "alerts (every 30 min), label (weekdays before the close) or report (Saturdays)"
        type: choice
        options: [alerts, label, report]
        default: alerts
      dry_run:
        description: "Print instead of pushing or writing"
        type: boolean
        default: false

# Never run two of the same job at once: overlapping alert runs could both see
# an item as new and send duplicate pushes. Different jobs may overlap.
concurrency:
  group: check-news-${{ inputs.job || 'alerts' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Migrate database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m alerts.db migrate

      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          JOB: ${{ inputs.job || 'alerts' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          case "$JOB" in
            alerts) module=alerts.main ;;
            label)  module=alerts.labeler ;;
            report) module=alerts.report ;;
            *) echo "unknown job: $JOB"; exit 1 ;;
          esac
          python -m "$module" $DRY_RUN

