name: Check news

# Triggered every 30 min by AWS EventBridge via the workflow_dispatch API
# (see README: "Reliable scheduling with AWS EventBridge"). GitHub's own
# `schedule:` trigger was removed because it was unreliable.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print alerts instead of pushing"
        type: boolean
        default: false

# Never run two checks at once: overlapping runs could both see an item as new
# and send duplicate pushes.
concurrency:
  group: check-news
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Migrate database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m alerts.db migrate

      - name: Run
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
        run: python -m alerts.main ${{ inputs.dry_run && '--dry-run' || '' }}

